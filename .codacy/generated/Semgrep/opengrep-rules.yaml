  - id: yaml.github-actions.semgrep-configuration.semgrep-github-action-push-without-branches.semgrep-github-action-push-without-branches
    message: The 'branches' field (in the push event configuration) contains no
      branches. This causes all branches to be scanned and may result in
      unneccessary duplicate findings across the entire codebase.
    severity: WARNING
    languages:
      - yaml
    paths:
      include:
        - .github/workflows/semgrep.yml
        - "*.test.yml"
    patterns:
      - pattern-either:
          - pattern: |
              on: [..., push, ...]
              ...
          - pattern: |
              on: push
              ...
          - pattern: |
              on:
                ...
                push: ""
                ...
              ...
          - pattern: |
              on:
                ...
                push: {}
                ...
              ...
          - patterns:
              - pattern-inside: |
                  on:
                    ...
                    push: ...
                    ...
                  ...
              - pattern-either:
                  - pattern: |
                      branches: ""
                  - pattern: |
                      branches: []
    metadata:
      category: correctness
      technology:
        - github-action
  - id: yaml.openapi.security.openai-consequential-action-false.openai-consequential-action-false
    languages:
      - yaml
    message: "Found 'x-openai-isConsequential: false' in a state-changing HTTP
      method: $METHOD $PATH. This Action configuration will enable the 'Always
      Allow' option for state-changing HTTP methods, such as POST, PUT, PATCH,
      or DELETE. The risk of a user selecting the 'Always Allow' button is that
      the agent could perform unintended actions on behalf of the user. When
      working with sensitive functionality, it is always best to include a Human
      In The Loop (HITL) type of control. Consider the trade-off between
      security  and user friction and then make a risk-based decision about this
      function."
    severity: WARNING
    pattern-either:
      - pattern-inside: |
          post:
            ...
            x-openai-isConsequential: false
      - pattern-inside: |
          put:
            ...
            x-openai-isConsequential: false
      - pattern-inside: |
          patch:
            ...
            x-openai-isConsequential: false
      - pattern-inside: |
          delete:
            ...
            x-openai-isConsequential: false
    metadata:
      category: security
      subcategory:
        - audit
      technology:
        - openapi
        - openai
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      cwe: "CWE-441: Unintended Proxy or Intermediary ('Confused Deputy')"
      owasp:
