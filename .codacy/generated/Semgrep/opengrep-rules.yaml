          ...
          $DECIPHER.update(...)
      - pattern-not-inside: |
          $DECIPHER = $CRYPTO.createDecipheriv('$ALGO', ...)
          ...
          $DECIPHER.final(...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: .*(-gcm|-ccm|-ocb|chacha20-poly1305)$
